name: Candidate package checks

"on":
  push:
    branches: [ci-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_SHA: f6334928fa83b3b622ed1c36cc4df089bf1a05d5
  PACKAGE_VERSION: 0.99.8

jobs:
  package-check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: package
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os == 'Linux'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package
          extra-packages: any::rcmdcheck
          needs: check
      - name: Record candidate identity and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          test -z "$(git -C package status --porcelain)"
          test "$(git -C package rev-parse HEAD)" = "$PACKAGE_SHA"
          git -C package rev-parse HEAD > validation-output/source-sha.txt
          Rscript -e 'd <- read.dcf("package/DESCRIPTION"); stopifnot(d[1, "Package"] == "scDonorAudit", d[1, "Version"] == Sys.getenv("PACKAGE_VERSION")); print(d[, c("Package", "Version")]); sessionInfo()' > validation-output/environment.log
      - name: Build and check candidate
        working-directory: validation-output
        shell: bash
        run: |
          set -euo pipefail
          R CMD build ../package 2>&1 | tee build.log
          cat > verify-tar.R <<'RSCRIPT'
          p <- Sys.glob("scDonorAudit_*.tar.gz")
          stopifnot(length(p) == 1L, basename(p) == paste0("scDonorAudit_", Sys.getenv("PACKAGE_VERSION"), ".tar.gz"))
          members <- utils::untar(p, list=TRUE)
          writeLines(members, "tar-contents.txt")
          bad <- grepl("(^|/)([^/]*[.]log|source-sha[.]txt|git-source-sha[.]txt|environment[.]log|tar-contents[.]txt|tar-sha256[.]txt|check|validation-output)(/|$)|[.](Rcheck|BiocCheck)(/|$)", members)
          stopifnot(!any(bad), any(grepl("^scDonorAudit/man/.*[.]Rd$", members)), any(grepl("^scDonorAudit/inst/doc/.*[.]html$", members)), all(paste0("scDonorAudit/inst/extdata/", c("example_counts.csv", "example_samples.csv", "crowell19_astrocyte_counts.csv", "crowell19_astrocyte_samples.csv")) %in% members))
          RSCRIPT
          Rscript verify-tar.R
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum scDonorAudit_*.tar.gz > tar-sha256.txt
          else
            shasum -a 256 scDonorAudit_*.tar.gz > tar-sha256.txt
          fi
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); a <- "--no-build-vignettes"; if (Sys.getenv("RUNNER_OS") != "Linux") a <- c(a, "--no-manual"); rcmdcheck::rcmdcheck(p, args=a, error_on="warning", check_dir="check")' 2>&1 | tee check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}
          path: validation-output/

  bioc-devel:
    name: Bioconductor devel / Linux / new package
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: package
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: git-source
      - name: Install check dependencies
        working-directory: package
        shell: bash
        run: |
          Rscript -e 'options(repos=BiocManager::repositories()); BiocManager::install(c("BiocCheck", "remotes", "rcmdcheck"), ask=FALSE, update=FALSE); remotes::install_deps(".", dependencies=TRUE, upgrade="never")'
      - name: Verify source and devel environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output
          test -z "$(git -C package status --porcelain)"
          test "$(git -C package rev-parse HEAD)" = "$PACKAGE_SHA"
          test -z "$(git -C git-source status --porcelain)"
          test "$(git -C git-source rev-parse HEAD)" = "$PACKAGE_SHA"
          git -C package rev-parse HEAD > validation-output/source-sha.txt
          git -C git-source rev-parse HEAD > validation-output/git-source-sha.txt
          Rscript -e 'for (path in c("package", "git-source")) { d <- read.dcf(file.path(path, "DESCRIPTION")); stopifnot(d[1, "Package"] == "scDonorAudit", d[1, "Version"] == Sys.getenv("PACKAGE_VERSION")); print(d[, c("Package", "Version")]) }; sessionInfo(); print(BiocManager::version())' > validation-output/environment.log
      - name: Build and check candidate
        working-directory: validation-output
        shell: bash
        run: |
          set -euo pipefail
          R CMD build ../package 2>&1 | tee build.log
          cat > verify-tar.R <<'RSCRIPT'
          p <- Sys.glob("scDonorAudit_*.tar.gz")
          stopifnot(length(p) == 1L, basename(p) == paste0("scDonorAudit_", Sys.getenv("PACKAGE_VERSION"), ".tar.gz"))
          members <- utils::untar(p, list=TRUE)
          writeLines(members, "tar-contents.txt")
          bad <- grepl("(^|/)([^/]*[.]log|source-sha[.]txt|git-source-sha[.]txt|environment[.]log|tar-contents[.]txt|tar-sha256[.]txt|check|validation-output)(/|$)|[.](Rcheck|BiocCheck)(/|$)", members)
          stopifnot(!any(bad), any(grepl("^scDonorAudit/man/.*[.]Rd$", members)), any(grepl("^scDonorAudit/inst/doc/.*[.]html$", members)), all(paste0("scDonorAudit/inst/extdata/", c("example_counts.csv", "example_samples.csv", "crowell19_astrocyte_counts.csv", "crowell19_astrocyte_samples.csv")) %in% members))
          RSCRIPT
          Rscript verify-tar.R
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum scDonorAudit_*.tar.gz > tar-sha256.txt
          else
            shasum -a 256 scDonorAudit_*.tar.gz > tar-sha256.txt
          fi
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); rcmdcheck::rcmdcheck(p, args="--no-manual", error_on="warning", check_dir="check")' 2>&1 | tee check.log
      - name: Check Git clone and new package tarball
        if: success() || failure()
        working-directory: validation-output
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'BiocCheck::BiocCheckGitClone("../git-source"); if (length(BiocCheck:::.BiocCheck$error)) quit(status=1)' 2>&1 | tee gitclone.log
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); BiocCheck::BiocCheck(p, `new-package`=TRUE); if (length(BiocCheck:::.BiocCheck$error) || length(BiocCheck:::.BiocCheck$warning)) quit(status=1)' 2>&1 | tee bioccheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-bioc-devel
          path: validation-output/
