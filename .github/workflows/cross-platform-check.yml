name: Candidate package checks

"on":
  push:
    branches: [ci-validation]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_SHA: e512915a139c590782c12768a1115b765ce865a2

jobs:
  package-check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: package
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os == 'Linux'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package
          extra-packages: any::rcmdcheck
          needs: check
      - name: Record candidate identity and environment
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PACKAGE_SHA"
          git rev-parse HEAD > source-sha.txt
          Rscript -e 'print(read.dcf("DESCRIPTION")[, c("Package", "Version")]); sessionInfo()' > environment.log
      - name: Build and check candidate
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          R CMD build . 2>&1 | tee build.log
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); a <- "--no-build-vignettes"; if (Sys.getenv("RUNNER_OS") != "Linux") a <- c(a, "--no-manual"); rcmdcheck::rcmdcheck(p, args=a, error_on="warning", check_dir="check")' 2>&1 | tee check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}
          path: |
            package/*.log
            package/source-sha.txt
            package/*.tar.gz
            package/check

  bioc-devel:
    name: Bioconductor devel / Linux / new package
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: package
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: git-source
      - name: Install check dependencies
        working-directory: package
        shell: bash
        run: |
          Rscript -e 'options(repos=BiocManager::repositories()); BiocManager::install(c("BiocCheck", "remotes", "rcmdcheck"), ask=FALSE, update=FALSE); remotes::install_deps(".", dependencies=TRUE, upgrade="never")'
      - name: Verify source and devel environment
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PACKAGE_SHA"
          git rev-parse HEAD > source-sha.txt
          Rscript -e 'print(read.dcf("DESCRIPTION")[, c("Package", "Version")]); sessionInfo(); print(BiocManager::version())' > environment.log
      - name: Build and check candidate
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          R CMD build . 2>&1 | tee build.log
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); rcmdcheck::rcmdcheck(p, args="--no-manual", error_on="warning", check_dir="check")' 2>&1 | tee check.log
      - name: Check Git clone and new package tarball
        if: success() || failure()
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'BiocCheck::BiocCheckGitClone("../git-source"); if (length(BiocCheck:::.BiocCheck$error)) quit(status=1)' 2>&1 | tee gitclone.log
          Rscript -e 'p <- Sys.glob("scDonorAudit_*.tar.gz"); stopifnot(length(p) == 1L); BiocCheck::BiocCheck(p, `new-package`=TRUE); if (length(BiocCheck:::.BiocCheck$error) || length(BiocCheck:::.BiocCheck$warning)) quit(status=1)' 2>&1 | tee bioccheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-bioc-devel
          path: |
            package/*.log
            package/source-sha.txt
            package/*.tar.gz
            package/check
            package/*.BiocCheck
